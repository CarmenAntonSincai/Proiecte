<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier de aplicații cu AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="page-css">
/* Layout: o coloană de lucru — antet cu clasele, traseul pe etape (stepper), galeria aplicațiilor, ghidul de publicare */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#16283C; --muted:#5A6A7B; --line:#D7DFE7;
  --navy:#1F3B57; --on-navy:#FFFFFF; --accent:#E07A2C; --accent-soft:#FBEBDD;
  --teal:#1A7F6C; --teal-soft:#E5F3EF; --warn:#A8501A; --warn-soft:#FBEDE3; --danger:#B3261E;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1822; --surface:#15212D; --ink:#E4ECF3; --muted:#9AABBC; --line:#283849;
  --navy:#A9CBEA; --on-navy:#0E1822; --accent:#F0974E; --accent-soft:#3A2617;
  --teal:#56C7AD; --teal-soft:#14302B; --warn:#F0A46E; --warn-soft:#3A2617; --danger:#F2867E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1822; --surface:#15212D; --ink:#E4ECF3; --muted:#9AABBC; --line:#283849;
  --navy:#A9CBEA; --on-navy:#0E1822; --accent:#F0974E; --accent-soft:#3A2617;
  --teal:#56C7AD; --teal-soft:#14302B; --warn:#F0A46E; --warn-soft:#3A2617; --danger:#F2867E; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
#app{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:44px}
h1,h2,h3{font-family:var(--f-display);color:var(--navy);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.01em}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0}
a{color:var(--teal)}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:13.5px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* butoane */
.btn{appearance:none;border:1.5px solid var(--navy);background:transparent;color:var(--navy);padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--teal-soft)}
.btn.primary{background:var(--navy);color:var(--on-navy)}
.btn.primary:hover{filter:brightness(1.12);background:var(--navy)}
.btn.small{padding:5px 11px;font-size:14px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:transparent;text-decoration:underline}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--warn-soft)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* antet */
header.top{display:grid;gap:14px;padding-bottom:26px;border-bottom:3px solid var(--navy)}
header.top .lead{max-width:68ch;font-size:17.5px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--navy);background:var(--navy);color:var(--on-navy)}
.tab .yr{font-weight:400;opacity:.8;margin-left:6px;font-size:14px}

.teacherbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:10px;padding:12px 16px;font-size:15px}
.teacherbar b{color:var(--warn)}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--danger);font-weight:600}

section{display:grid;gap:18px}
.sechead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.sechead p{max-width:62ch}

/* traseul */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;counter-reset:s}
.step{position:relative;min-width:0}
.step button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;width:100%;padding:14px 14px 16px 0}
.step .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--surface);border:2.5px solid var(--navy);color:var(--navy);position:relative;z-index:1}
.step:not(:last-child)::after{content:"";position:absolute;top:33px;left:38px;right:0;height:2.5px;background:var(--line)}
.step .fisa{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.step .t{font-weight:700;line-height:1.25;padding-right:8px}
.step .n{font-size:13.5px;color:var(--muted)}
.step[aria-current="true"] .dot{background:var(--navy);color:var(--on-navy)}
.step button:hover .t{text-decoration:underline}
.step button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (max-width:620px){
  .steps{grid-template-columns:1fr}
  .step button{grid-template-columns:38px 1fr;column-gap:14px;padding:8px 0}
  .step button > :not(.dot){grid-column:2}
  .step .dot{grid-row:1 / span 3}
  .step .fisa{margin-top:0}
  .step:not(:last-child)::after{top:46px;left:18px;right:auto;width:2.5px;height:calc(100% - 38px)}
}
.stagecard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:20px 22px;display:grid;gap:12px}
.stagecard{gap:16px}
.stagecard h4{margin:0 0 8px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.stagecard .todo p{max-width:72ch}
.stagecard .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 28px;padding-top:14px;border-top:1px solid var(--line)}
.stagecard .cols > div{min-width:0}
.stagecard ul{margin:0;padding-left:0;list-style:none;display:grid;gap:10px}
.stagecard ul.checks li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.stagecard ul.checks li::before{content:"☐";color:var(--navy);font-weight:700}
.stagecard ul.files li{display:grid;gap:3px}
.stagecard .chips{display:flex;flex-wrap:wrap;gap:6px}
.stagecard .chips code{font-size:13.5px;font-weight:600;padding:2px 8px;border:1px solid var(--line)}
.stagecard .what{color:var(--muted);font-size:15px}

/* galeria */
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px;color:var(--muted)}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.card .name{font-weight:700;font-size:17px}
.card .tema{color:var(--muted);font-size:15px;margin-top:-6px}
.bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.bar i{height:7px;border-radius:4px;background:var(--line)}
.bar i.on{background:var(--teal)}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.link{display:flex;align-items:center;gap:8px;min-width:0}
.link a{font-family:var(--f-mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.no{background:var(--warn-soft);color:var(--warn)}
.open{font-weight:700;text-decoration:none}
.open:hover{text-decoration:underline}
.empty{border:2px dashed var(--line);border-radius:12px;padding:28px 24px;display:grid;gap:10px;justify-items:start;color:var(--muted)}
.empty h3{color:var(--ink)}

/* formulare */
.form{background:var(--surface);border:1.5px solid var(--navy);border-radius:10px;padding:18px 20px;display:grid;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
label.f{display:grid;gap:4px;font-weight:600;font-size:14.5px;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=url],textarea,select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;background:var(--bg)}
input:focus,textarea:focus,select:focus{border-color:var(--navy);outline:none}
textarea{min-height:90px;resize:vertical}
.wide{grid-column:1 / -1}
.check{font-size:14px;padding:8px 12px;border-radius:8px}
.check.ok{background:var(--teal-soft);color:var(--teal)}
.check.warn{background:var(--warn-soft);color:var(--warn)}
.confirm{background:var(--warn-soft);border-radius:8px;padding:10px 12px;display:grid;gap:8px;font-size:14.5px}

/* ghid */
.guide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
@media (max-width:820px){.guide{grid-template-columns:1fr}}
.about{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px 32px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.about > div{display:grid;gap:10px;align-content:start;min-width:0}
.about p{max-width:68ch}
.uses{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.uses li{padding-left:14px;border-left:3px solid var(--teal-soft)}
.uses b{color:var(--navy)}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:h}
.howto li{counter-increment:h;display:grid;grid-template-columns:30px 1fr;gap:10px}
.howto li::before{content:counter(h);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--warn);font-weight:800;display:grid;place-items:center;font-size:14px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--teal-soft);color:var(--ink);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.msg{font-family:var(--f-mono);font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
footer{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion: no-preference){ .card,.stagecard{transition:border-color .15s} }
</style>
</head>
<body>
<div id="app"></div>

<script type="application/json" id="date">{"proiect": {"titlu": "Atelier de aplicații cu AI", "descriere": "Construim, pas cu pas, o aplicație web educativă pentru elevii mai mici, lucrând împreună cu un asistent AI: noi gândim, testăm și înțelegem codul, AI-ul ne ajută să mergem mai repede. La final, fiecare aplicație este publicată pe GitHub Pages și apare mai jos."}, "etape": [{"fisa": "Fișa de lucru 1", "titlu": "Ideea aplicației și primul prompt", "descriere": "Alegi tema aplicației tale: un quiz educativ pentru elevii mai mici, pe un subiect pe care îl stăpânești bine (matematică, științe, geografie, limbi străine). Stabilești pentru ce clasă este aplicația și ce trebuie să învețe cei care o folosesc. Scrii primul prompt către AI ca să-ți organizezi ideile și analizezi critic răspunsul: ce păstrezi, ce schimbi și de ce. Pornești jurnalul AI, în care vei nota la fiecare oră ce ai cerut, ce ai primit și ce ai folosit.", "fisiere": ["Fișa de lucru 1 — completată: tema, publicul și ideile pentru întrebări"], "continut": ["Tema aplicației și clasa căreia i se adresează", "Primul prompt trimis, cu răspunsul analizat", "Prima intrare în jurnalul AI"]}, {"fisa": "Fișa de lucru 2", "titlu": "Structura paginii (HTML)", "descriere": "Creezi folderul proiectului și fișierul index.html, apoi construiești scheletul aplicației: titlul, o scurtă prezentare, butonul START, zona în care apare scorul și zona în care vor apărea întrebările. Folosești AI-ul ca să înțelegi etichetele HTML, nu ca să copiezi o pagină gata făcută: fiecare element din cod trebuie să-l poți explica.", "fisiere": ["index.html — structura paginii, cu \u003cmeta charset=\"utf-8\"> ca diacriticele să apară corect", "Fișa de lucru 2 — completată"], "continut": ["Elementele cu id-urile start (butonul), scor și continut", "Al doilea prompt trimis, cu răspunsul analizat", "Intrarea din jurnalul AI"]}, {"fisa": "Fișa de lucru 3", "titlu": "Aspectul paginii (CSS)", "descriere": "Creezi fișierul style.css și îl legi de index.html. Alegi o culoare principală, un font ușor de citit pentru copii și o spațiere aerisită, apoi stilizezi titlul, butonul START și zona de scor. Ceri AI-ului mai multe variante de design și o alegi pe cea potrivită publicului tău, cu argumente.", "fisiere": ["style.css — stilurile aplicației: culori, fonturi, butoane, spațiere", "index.html — actualizat cu \u003clink rel=\"stylesheet\" href=\"style.css\">", "Fișa de lucru 3 — completată"], "continut": ["Culoarea principală și fontul alese, cu motivul alegerii", "Al treilea prompt trimis, cu răspunsul analizat", "Intrarea din jurnalul AI"]}, {"fisa": "Fișa de lucru 4", "titlu": "Prima funcționalitate (JavaScript)", "descriere": "Faci pagina interactivă: butonul START pornește jocul, întrebarea apare cu 3 variante de răspuns, iar scorul și mesajul de feedback se schimbă după fiecare răspuns. Testezi aplicația, găsești un bug, îl descrii singur și îl corectezi apoi împreună cu AI-ul. La final, adaugi restul întrebărilor și obții quizul complet.", "fisiere": ["script.js — logica quizului: întrebările, verificarea răspunsurilor, scorul și mesajele", "index.html — actualizat cu \u003cscript src=\"script.js\"> și zonele intrebare, raspunsuri, mesaj", "style.css — actualizat cu stilul butoanelor de răspuns", "Fișa de lucru 4 — completată: explicațiile codului, testele și tabelul de debugging"], "continut": ["Quizul complet: toate întrebările afișate pe rând, cu scorul final", "Bugul din testul 3 găsit, explicat și corectat", "Prompturile 4 și 5 trimise, cu răspunsurile analizate", "Intrarea din jurnalul AI"]}, {"fisa": "Publicare", "titlu": "Aplicația pe GitHub Pages", "descriere": "Pui aplicația pe internet, ca oricine să o poată folosi. Îți faci cont pe GitHub sau te conectezi cu contul primit de la școală. Creezi un repository public, încarci fișierele proiectului, activezi GitHub Pages și verifici că aplicația funcționează la adresa publică, inclusiv de pe telefon. Apoi trimiți linkul, ca aplicația ta să apară în galeria clasei.", "fisiere": ["index.html, style.css, script.js — versiunile finale, încărcate direct în rădăcina repository-ului"], "continut": ["Cont GitHub activ, cu adresa de e-mail confirmată", "Linkul paginii publicate (…github.io), deschis și testat", "Linkul repository-ului", "Mesajul cu linkurile, trimis profesorului din formularul de mai jos"]}], "clase": [{"id": "11c", "nume": "11C", "an": "2026–2027", "elevi": []}]}</script>
<script id="page-js">
(function(){
"use strict";
var TITLE = "Atelier de aplicații cu AI";
var FONTS = 'https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap';
var RESET = "";
try { var hs = document.head && document.head.querySelector("style"); RESET = hs ? hs.textContent : ""; } catch (e) {}
var CSS = document.getElementById("page-css").textContent;
var JS = document.getElementById("page-js").textContent;

var S = JSON.parse(document.getElementById("date").textContent);
if (!S.etape) S.etape = [];
if (!S.clase) S.clase = [];

var ui = { clasa: null, etapa: 0, edit: null, del: null, status: "", err: false,
           f: { nume: "", tema: "", url: "", repo: "" } };
try { ui.clasa = localStorage.getItem("clasa-activa"); } catch (e) {}
var canWrite = false, art = null, saving = false, mode = "view";

function uid(){ return Math.random().toString(36).slice(2, 9); }
function h(tag, props){
  var el = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if (v == null || v === false) return;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  });
  (function add(list){ list.forEach(function(c){
    if (c == null || c === false) return;
    if (Array.isArray(c)) add(c); else el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }); })(kids);
  return el;
}
function safeHref(u){ try { var x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; } catch (e) { return null; } }
function checkPages(u){
  u = (u || "").trim();
  if (!u) return null;
  var x; try { x = new URL(u); } catch (e) { return { ok:false, t:"Nu este un link complet. Trebuie să înceapă cu https://" }; }
  var host = x.hostname.toLowerCase();
  if (host === "github.com") return { ok:false, t:"Acesta e linkul repository-ului (codul). Linkul paginii publicate arată așa: https://utilizator.github.io/nume-repo/" };
  if (/\.github\.io$/.test(host)) {
    if (x.protocol !== "https:") return { ok:false, t:"Folosește varianta cu https://" };
    return { ok:true, t:"Arată ca un link GitHub Pages corect. Deschide-l o dată să verifici că pagina se încarcă." };
  }
  return { ok:false, t:"Nu pare un link GitHub Pages (…github.io). Verifică în repository: Settings → Pages." };
}
function klass(){ var c = S.clase.find(function(c){ return c.id === ui.clasa; }); return c || S.clase[0] || null; }
function setStatus(t, err){ ui.status = t; ui.err = !!err; var s = document.getElementById("st"); if (s){ s.textContent = t; s.className = "status" + (err ? " err" : ""); } }

/* ---------- salvare: pagina își publică singură noua versiune ---------- */
function buildDoc(state){
  var json = JSON.stringify(state).replace(/</g, "\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
    + '<title>' + TITLE + '</title>\n'
    + '<link rel="stylesheet" href="' + FONTS + '">\n'
    + '<style id="page-css">' + CSS + '</style>\n'
    + '<div id="app"></div>\n'
    + '<script type="application/json" id="date">' + json + '</scr' + 'ipt>\n'
    + '<script id="page-js">' + JS + '</scr' + 'ipt>\n'
    + '</body></html>';
}
var DRAFT = "atelier-ai-ciorna";
function dataText(){ return JSON.stringify(S, null, 2); }
function commit(mut){
  if (!canWrite || saving) return;
  var next = JSON.parse(JSON.stringify(S));
  mut(next);
  S = next; ui.edit = null; ui.del = null;
  if (mode === "local") {
    try { localStorage.setItem(DRAFT, JSON.stringify(S)); } catch (e) {}
    ui.dirty = true;
    render();
    setStatus("Modificare păstrată în acest browser. Când termini, copiază datele în date.json pe GitHub.");
    return;
  }
  render();
  saving = true; setStatus("Se salvează…");
  art.publish(buildDoc(S)).then(function(){
    saving = false; setStatus("Salvat. Toți cei care deschid pagina văd versiunea nouă.");
  }, function(e){
    saving = false;
    var c = e && e.code;
    if (c === "conflict") setStatus("Altcineva a salvat în același timp. Pagina s-a reîncărcat; refă ultima modificare.", true);
    else if (c === "not_writer" || c === "not_granted") { canWrite = false; render(); setStatus("Nu ai drept de editare pe această pagină.", true); }
    else setStatus("Nu s-a putut salva (" + (c || "eroare") + "). Încearcă din nou.", true);
  });
}

/* ---------- componente ---------- */
function field(label, id, val, opts){
  opts = opts || {};
  var input = opts.area ? h("textarea", { id:id }) : h("input", { id:id, type: opts.type || "text", placeholder: opts.ph, autocomplete:"off" });

          h("li", null, h("b", null, "Primești unelte gratuite. "), "Ca elev, poți cere GitHub Student Developer Pack, cu acces gratuit la unelte pentru programatori.")))),
    h("div", { class:"guide" },
      h("div", { style:"display:grid;gap:14px" },
        h("p", { class:"muted" }, "Pașii, de la cont la link:"),

          h("li", null, h("span", null, h("b", null, "Intră în cont. "), "Dacă școala ți-a dat un cont GitHub, conectează-te cu el (", h("b", null, "Sign in"), "). Altfel, fă-ți unul pe ", h("code", null, "github.com"), " (", h("b", null, "Sign up"), "), cu o adresă de e-mail la care ai acces. Alege cu grijă numele de utilizator: apare în adresa aplicației tale, ", h("code", null, "utilizator.github.io"), ". Confirmă adresa de e-mail din mesajul primit.")),
          h("li", null, h("span", null, "Creează pe GitHub un repository public (ex: ", h("code", null, "quiz-sistem-solar"), ").")),
          h("li", null, h("span", null, "Încarcă fișierele ", h("code", null, "index.html"), ", ", h("code", null, "style.css"), ", ", h("code", null, "script.js"), " direct în rădăcina repository-ului (nu într-un folder).")),
          h("li", null, h("span", null, "Mergi la ", h("b", null, "Settings → Pages"), ". La Source alege ", h("b", null, "Deploy from a branch"), ", apoi ramura ", h("code", null, "main"), " și folderul ", h("code", null, "/ (root)"), ". Apasă Save.")),

          h("li", null, h("span", null, "Completează formularul și trimite mesajul. Linkul tău va apărea în galeria clasei.")))),

function render(){
  var app = document.getElementById("app");
  var y = window.scrollY, act = document.activeElement && document.activeElement.id;
  app.replaceChildren.apply(app, [Header(), TeacherBar(), Stages(), Gallery(), Publish(),
    h("footer", null, "Pagina poate fi refolosită cu alte clase: profesorul adaugă o clasă nouă, iar etapele rămân aceleași. Aplicațiile sunt ale elevilor; linkurile duc către paginile lor de pe GitHub.")].filter(Boolean));
  if (act) { var e = document.getElementById(act); if (e && e.focus) e.focus({ preventScroll:true }); }
  window.scrollTo(0, y);
}

render();
if (window.claude && typeof window.claude.use === "function") {
  /* în Claude: pagina se salvează singură */
  Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function(r){
    art = r[0];
    var u = r[1];
    if (!art || !u) return false;
    return u.canEdit();
  }).then(function(ok){ if (ok) { canWrite = true; mode = "artifact"; render(); } }, function(){});
} else {
  /* pe GitHub Pages: datele vin din date.json; cu #profesor în adresă se poate edita local */
  var startLocal = function(){
    if (location.hash !== "#profesor" || mode === "local") return;
    mode = "local"; canWrite = true;
    try { var d = localStorage.getItem(DRAFT); if (d) { S = JSON.parse(d); ui.dirty = true; ui.status = "Ai modificări din sesiunea trecută, încă necopiate în date.json."; } } catch (e) {}
    render();
  };
  var loadData = (location.protocol === "http:" || location.protocol === "https:")
    ? fetch("date.json", { cache:"no-store" }).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
        if (d && d.etape && d.clase) { S = d; render(); }
      }, function(){})
    : Promise.resolve();
  loadData.then(startLocal);
  window.addEventListener("hashchange", startLocal);
}
})();
